<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Complete and save interactive Maths CLIL worksheets."
    />
    <title>Interactive worksheet · Maths CLIL</title>
    <link rel="stylesheet" href="/drawing-pad.css" />
    <style>
      :root {
        font-family: "DM Sans", "Segoe UI", sans-serif;
        color: #25342d;
        background: #edf3ee;
        font-synthesis: none;
        line-height: 1.55;
        text-rendering: optimizeLegibility;
        --green: #2d684d;
        --line: #e2e8e1;
        --ink: #25342d;
        --muted: #62706a;
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body { margin: 0; min-width: 320px; }
      button, textarea { font: inherit; }
      a { color: inherit; }
      a:focus-visible, button:focus-visible, textarea:focus-visible {
        outline: 3px solid #8cc9a4;
        outline-offset: 3px;
      }
      .page { width: min(1050px, calc(100% - 36px)); margin: 0 auto; padding: 28px 0 56px; }
      .back-link { color: var(--green); font-weight: 700; text-decoration: none; }
      .heading { margin: 28px 0 20px; }
      .eyebrow { color: #5d776b; font-size: 12px; font-weight: 800; letter-spacing: 1.5px; }
      h1 { margin: 8px 0; font-size: clamp(30px, 5vw, 46px); line-height: 1.12; letter-spacing: -1.6px; }
      .heading p { color: var(--muted); margin: 0; }
      .progress-panel { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px 20px; padding: 18px; border: 1px solid var(--line); border-radius: 18px; background: #fffefa; }
      .progress-panel progress { grid-column: 1 / -1; width: 100%; height: 10px; accent-color: var(--green); }
      .progress-label { font-weight: 700; }
      .progress-count { color: var(--muted); font-size: 14px; }
      .toolbar { display: flex; justify-content: flex-end; gap: 10px; margin: 16px 0; }
      .toolbar button { padding: 9px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fffefa; color: var(--ink); font-weight: 700; }
      .toolbar button:hover { border-color: var(--green); }
      .toolbar button:disabled { cursor: not-allowed; opacity: 0.55; }
      .status { min-height: 24px; color: var(--green); font-size: 14px; }
      .status.error { color: #a33b2c; }
      .question-list { display: grid; gap: 14px; }
      .question { padding: 20px; border: 1px solid var(--line); border-radius: 18px; background: #fffefa; }
      .question h2 { margin: 0 0 8px; color: var(--green); font-size: 15px; }
      .prompt { margin: 0 0 14px; white-space: pre-line; }
      .answer { display: block; width: 100%; min-height: 100px; padding: 12px; resize: vertical; border: 1px solid #cbd6cc; border-radius: 10px; background: #fff; color: var(--ink); }
      .answer-feedback { margin-top: 14px; padding: 14px 16px; border-left: 4px solid var(--green); border-radius: 8px; background: #eff7f0; }
      .answer-feedback h3 { margin: 0 0 5px; font-size: 14px; }
      .answer-feedback p { margin: 0; white-space: pre-line; }
      .unanswered-feedback { border-left-color: #9c8050; background: #fbf5e9; }
      .completion { display: flex; align-items: center; gap: 9px; margin-top: 12px; color: var(--muted); font-size: 14px; }
      .completion input { width: 18px; height: 18px; accent-color: var(--green); }
      .empty { margin-top: 30px; padding: 24px; border-radius: 18px; background: #fffefa; }
      .answer-modes { display: inline-flex; gap: 4px; margin-bottom: 10px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: #f3f7f3; }
      .answer-modes button { padding: 6px 16px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 700; cursor: pointer; }
      .answer-modes button[aria-pressed="true"] { background: #fff; color: var(--green); box-shadow: 0 1px 3px rgba(37, 52, 45, 0.15); }
      .answer-modes button.has-content::after { content: ""; display: inline-block; width: 7px; height: 7px; margin-left: 7px; border-radius: 50%; background: var(--green); vertical-align: middle; }
      .student-panel { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 16px 0 0; }
      .student-panel label { font-weight: 700; }
      .student-panel input { min-width: 220px; padding: 8px 10px; border: 1px solid #cbd6cc; border-radius: 10px; font: inherit; }
      .teacher-link { display: inline-block; margin-top: 28px; color: var(--muted); font-size: 14px; }
      @media (max-width: 600px) {
        .page { width: min(100% - 24px, 1050px); padding-top: 20px; }
        .progress-panel { grid-template-columns: 1fr; gap: 6px; }
        .progress-panel progress { grid-column: auto; margin: 6px 0; }
        .toolbar { justify-content: flex-start; }
        .question { padding: 16px; }
      }
    </style>
  </head>
  <body>
    <main class="page" id="worksheet">
      <a class="back-link" id="worksheet-back-link" href="/?page=worksheets-chapter&amp;chapter=chapter-1">← Back to worksheets</a>
      <div id="worksheet-content"></div>
    </main>
    <script src="/worksheet-content.js"></script>
    <script src="/worksheet-content-chapter-2.js"></script>
    <script src="/worksheet-content-chapter-3.js"></script>
    <script src="/worksheet-content-chapter-4.js"></script>
    <script src="/worksheet-content-chapter-5.js"></script>
    <script src="/worksheet-figures/manifest.js"></script>
    <script src="/worksheet-drawings.js"></script>
    <script src="/drawing-check.js"></script>
    <script src="/drawing-pad.js"></script>
    <script>
      const sets = window.WORKSHEET_SETS;
      const printablePdfs = {
        "lesson-1": "https://drive.google.com/file/d/1dBl0c7a2gNWKzc1lm0acqJUf00z7tnJU/view?usp=sharing",
        "lesson-2": "https://drive.google.com/file/d/1gchpB7h5cUrDAB_VKtjGMYzkLe6p5nUC/view?usp=sharing",
        "lesson-3": "https://drive.google.com/file/d/1Ga9SV_-UatZGyPs77IuG5zYlcVii5I12/view?usp=sharing",
        "lesson-4": "https://drive.google.com/file/d/1ln5FIiFr22hHEr20dFKwSWWTU6o2vC4h/view?usp=sharing",
        "lesson-5": "https://drive.google.com/file/d/10ogU1Ktp3-gV1GS_3cGfxXS-tZd0L1kG/view?usp=sharing",
        "lesson-6": "https://drive.google.com/file/d/1hOQFNSeqCCiSbThjoAKHHylSbQOhTpYs/view?usp=sharing",
        "lesson-7": "https://drive.google.com/file/d/117DX0epkCpbZM_m2eZmn-GYIkKdgp1Lo/view?usp=sharing",
        review: "https://drive.google.com/file/d/1EGrt6uglC0ppEmb2KiiRwaF25o9DFRK5/view?usp=sharing",
      };
      const id = new URLSearchParams(window.location.search).get("lesson");
      const worksheetId = id || "";
      const lessonMatch = /^lesson-(\d+)$/.exec(worksheetId);
      const reviewMatch = /^chapter-(\d+)-review$/.exec(worksheetId);
      const lessonNumber = Number(lessonMatch?.[1] || 0);
      const chapterNumber =
        worksheetId === "review"
          ? 1
          : reviewMatch
            ? Number(reviewMatch[1])
            : lessonNumber >= 1 && lessonNumber <= 7
              ? 1
              : lessonNumber <= 12 && lessonNumber >= 8
                ? 2
                : lessonNumber <= 17 && lessonNumber >= 13
                  ? 3
                  : lessonNumber <= 20 && lessonNumber >= 18
                    ? 4
                    : lessonNumber <= 22 && lessonNumber >= 21
                      ? 5
                      : 0;
      if (chapterNumber >= 1 && chapterNumber <= 5) {
        document.getElementById("worksheet-back-link").href =
          `/?page=worksheets-chapter&chapter=chapter-${chapterNumber}`;
      }
      const pdfParameter = new URLSearchParams(window.location.search).get("pdf");
      const worksheet = sets[id];
      const root = document.getElementById("worksheet-content");

      function getRequestedPdfUrl() {
        if (pdfParameter === null) return printablePdfs[id];
        try {
          const url = new URL(pdfParameter, window.location.href);
          if (url.origin === window.location.origin && /\.pdf$/i.test(url.pathname)) {
            return url.href;
          }
        } catch (error) {
          console.error("Invalid printable PDF URL.", error);
        }
        return null;
      }

      if (!worksheet) {
        root.innerHTML = '<section class="empty"><h1>Worksheet not found</h1><p>Choose a worksheet from the worksheets page.</p></section>';
      } else {
        document.title = `${worksheet.title} · Maths CLIL`;
        const key = `maths-clil-worksheet:${id}`;
        const heading = document.createElement("header");
        heading.className = "heading";
        const eyebrow = document.createElement("div");
        eyebrow.className = "eyebrow";
        eyebrow.textContent = "PRACTISE & APPLY";
        const title = document.createElement("h1");
        title.textContent = worksheet.title;
        const description = document.createElement("p");
        description.textContent = "Write or draw your answers below. Your work is saved in this browser. Print opens the original worksheet PDF.";
        heading.append(eyebrow, title, description);
        root.append(heading);

        const progressPanel = document.createElement("section");
        progressPanel.className = "progress-panel";
        const progressLabel = document.createElement("span");
        progressLabel.className = "progress-label";
        progressLabel.textContent = "Worksheet progress";
        const count = document.createElement("span");
        count.className = "progress-count";
        count.setAttribute("aria-live", "polite");
        count.setAttribute("aria-atomic", "true");
        const progress = document.createElement("progress");
        progress.max = worksheet.questions.length;
        progressPanel.append(progressLabel, count, progress);
        root.append(progressPanel);

        const NAME_KEY = "maths-clil-student-name";
        const studentPanel = document.createElement("div");
        studentPanel.className = "student-panel";
        const nameLabel = document.createElement("label");
        nameLabel.htmlFor = "student-name";
        nameLabel.textContent = "Your name";
        const nameInput = document.createElement("input");
        nameInput.id = "student-name";
        nameInput.type = "text";
        nameInput.maxLength = 80;
        nameInput.autocomplete = "name";
        nameInput.placeholder = "Needed to submit your work";
        try {
          nameInput.value = localStorage.getItem(NAME_KEY) || "";
        } catch (error) {
          console.error("Unable to load the saved name.", error);
        }
        nameInput.addEventListener("input", () => {
          try {
            localStorage.setItem(NAME_KEY, nameInput.value);
          } catch (error) {
            console.error("Unable to save the name.", error);
          }
        });
        studentPanel.append(nameLabel, nameInput);
        root.append(studentPanel);

        const toolbar = document.createElement("div");
        toolbar.className = "toolbar";
        const printButton = document.createElement("button");
        printButton.type = "button";
        printButton.textContent = "Print / Save as PDF";
        printButton.addEventListener("click", openPrintablePdf);
        const checkButton = document.createElement("button");
        checkButton.type = "button";
        checkButton.textContent = "Check answers";
        const resetButton = document.createElement("button");
        resetButton.type = "button";
        resetButton.textContent = "Clear my answers";
        const submitButton = document.createElement("button");
        submitButton.type = "button";
        submitButton.textContent = "Submit work (file)";
        submitButton.title = "Download your answers as a file to send to your teacher";
        submitButton.addEventListener("click", submitWork);
        toolbar.append(printButton, checkButton, resetButton, submitButton);
        root.append(toolbar);

        const status = document.createElement("p");
        status.className = "status";
        status.setAttribute("role", "status");
        status.setAttribute("aria-live", "polite");
        root.append(status);

        function openPrintablePdf() {
          const pdfUrl = getRequestedPdfUrl();
          if (!pdfUrl) {
            status.textContent = "The printable PDF is unavailable for this worksheet.";
            status.classList.add("error");
            console.error(`No valid printable PDF is configured for worksheet "${id}".`);
            return;
          }
          const printWindow = window.open(pdfUrl, "_blank");
          if (!printWindow) {
            const pdfLink = document.createElement("a");
            pdfLink.href = pdfUrl;
            pdfLink.target = "_blank";
            pdfLink.rel = "noopener noreferrer";
            pdfLink.textContent = "Open the PDF manually.";
            status.replaceChildren(
              document.createTextNode("Your browser blocked the new tab. "),
              pdfLink,
            );
            status.classList.add("error");
            return;
          }
          printWindow.opener = null;
          status.textContent = "The original worksheet PDF opened in a new tab. Use its Print button to print or save as PDF.";
          status.classList.remove("error");
        }

        // Level A submission: the pupil downloads a JSON file and sends it to
        // the teacher, who opens it in /grade.html. Checks are recomputed there.
        function submitWork() {
          const name = nameInput.value.trim();
          if (!name) {
            status.textContent = "Type your name before submitting your work.";
            status.classList.add("error");
            nameInput.focus();
            return;
          }
          const answered = worksheet.questions.filter(hasAnswer).length;
          if (!answered) {
            status.textContent = "Answer at least one question before submitting.";
            status.classList.add("error");
            return;
          }
          const answers = {};
          const drawings = {};
          worksheet.questions.forEach((question) => {
            if (hasText(question)) answers[question.number] = saved.answers[question.number];
            if (hasDrawing(question)) drawings[question.number] = saved.drawings[question.number];
          });
          const submission = {
            format: "maths-clil-submission",
            version: 1,
            worksheetId: id,
            worksheetTitle: worksheet.title,
            student: name,
            submittedAt: new Date().toISOString(),
            answers,
            drawings,
          };
          const blob = new Blob([JSON.stringify(submission)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = `${safeTitle} - ${name.replace(/[\\/:*?"<>|]+/g, "-")}.json`;
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          status.textContent = `Your work (${answered} of ${worksheet.questions.length} questions) was saved as a file. Send that file to your teacher.`;
          status.classList.remove("error");
        }

        document.addEventListener("keydown", (event) => {
          if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "p") {
            event.preventDefault();
            openPrintablePdf();
          }
        });

        const list = document.createElement("div");
        list.className = "question-list";
        const teacherLink = document.createElement("a");
        teacherLink.className = "teacher-link";
        teacherLink.href = "/grade.html";
        teacherLink.textContent = "Teachers: mark submitted work →";
        root.append(list, teacherLink);

        let saved = { answers: {}, completed: {}, drawings: {} };
        let storageAvailable = true;
        let progressMigrated = false;
        try {
          const value = localStorage.getItem(key);
          if (value) {
            const parsed = JSON.parse(value);
            if (
              !parsed ||
              typeof parsed !== "object" ||
              !parsed.answers ||
              typeof parsed.answers !== "object" ||
              !parsed.completed ||
              typeof parsed.completed !== "object" ||
              (parsed.drawings !== undefined &&
                (!parsed.drawings || typeof parsed.drawings !== "object"))
            ) {
              throw new Error("Saved worksheet progress has an unexpected format.");
            }
            saved = parsed;
            if (!saved.drawings) saved.drawings = {};
            worksheet.questions.forEach((question) => {
              if (!question.legacyNumber) return;
              for (const section of ["answers", "completed"]) {
                if (
                  Object.prototype.hasOwnProperty.call(saved[section], question.legacyNumber)
                ) {
                  if (
                    !Object.prototype.hasOwnProperty.call(saved[section], question.number)
                  ) {
                    saved[section][question.number] = saved[section][question.legacyNumber];
                  }
                  delete saved[section][question.legacyNumber];
                  progressMigrated = true;
                }
              }
            });
          }
        } catch (error) {
          storageAvailable = false;
          status.textContent = "Saved work could not be loaded or stored in this browser.";
          status.classList.add("error");
          console.error("Unable to load worksheet progress.", error);
        }

        function updateProgress() {
          const completed = worksheet.questions.filter(
            (question) => saved.completed[question.number],
          ).length;
          count.textContent = `${completed} of ${worksheet.questions.length} questions completed`;
          progress.value = completed;
        }

        function saveProgress() {
          if (!storageAvailable) return;
          try {
            localStorage.setItem(key, JSON.stringify(saved));
            status.textContent = "Progress saved on this device.";
            status.classList.remove("error");
          } catch (error) {
            storageAvailable = false;
            status.textContent = "Your browser could not save this worksheet. Keep this page open to avoid losing your answers.";
            status.classList.add("error");
            console.error("Unable to save worksheet progress.", error);
          }
        }

        if (progressMigrated) saveProgress();

        let answersVisible = false;

        function hasText(question) {
          return Boolean(saved.answers[question.number]?.trim());
        }

        function hasDrawing(question) {
          return Boolean(saved.drawings[question.number]?.items?.length);
        }

        function hasAnswer(question) {
          return hasText(question) || hasDrawing(question);
        }

        function updateCheckButton() {
          checkButton.disabled =
            !answersVisible &&
            worksheet.questions.every((question) => !hasAnswer(question));
        }

        updateCheckButton();

        function updateAnswerFeedback(question, feedback) {
          feedback.replaceChildren();
          const heading = document.createElement("h3");
          const answer = document.createElement("p");
          if (hasAnswer(question)) {
            feedback.className = "answer-feedback";
            heading.textContent = "Suggested answer";
            answer.textContent = question.answer;
          } else {
            feedback.className = "answer-feedback unanswered-feedback";
            heading.textContent = "Try this question first";
            answer.textContent = "Write or draw your answer above, then select “Check answers” to reveal the suggested answer.";
          }
          feedback.append(heading, answer);
          feedback.hidden = !answersVisible;
        }

        checkButton.addEventListener("click", () => {
          answersVisible = !answersVisible;
          checkButton.textContent = answersVisible ? "Hide answers" : "Check answers";
          worksheet.questions.forEach((question) => {
            updateAnswerFeedback(question, feedbackByQuestion.get(question.number));
          });
          if (answersVisible) {
            status.textContent = "Suggested answers are shown for questions you have answered. Compare your work and mark each question complete when you are ready.";
          } else {
            status.textContent = "Suggested answers hidden.";
          }
        });

        // Picture for the question (from worksheet-drawings.js), shown under the prompt.
        function questionFigure(question) {
          const figure = question.figure;
          if (!figure || typeof figure.src !== "string" || !figure.src.startsWith("/worksheet-figures/")) return [];
          const wrap = document.createElement("figure");
          wrap.className = "question-figure";
          const image = document.createElement("img");
          image.src = figure.src;
          image.alt = figure.alt || `Figure for question ${question.number}`;
          image.loading = "lazy";
          wrap.append(image);
          return [wrap];
        }

        const feedbackByQuestion = new Map();
        const answerViews = new Map();
        const safeTitle = worksheet.title.replace(/[^\w\s-]+/g, "").trim();
        worksheet.questions.forEach((question) => {
          const card = document.createElement("section");
          card.className = "question";
          const number = document.createElement("h2");
          number.textContent = question.number;
          const prompt = document.createElement("p");
          prompt.className = "prompt";
          prompt.textContent = question.prompt;
          const answer = document.createElement("textarea");
          answer.className = "answer";
          answer.setAttribute("aria-label", `Answer to question ${question.number}`);
          answer.placeholder = "Write your answer here...";
          answer.value = saved.answers[question.number] || "";
          answer.addEventListener("input", () => {
            saved.answers[question.number] = answer.value;
            refreshModes();
            updateCheckButton();
            if (answersVisible) {
              updateAnswerFeedback(question, feedbackByQuestion.get(question.number));
            }
            saveProgress();
          });

          // Write / Draw choice. Questions with a `drawing` field open on Draw.
          const modes = document.createElement("div");
          modes.className = "answer-modes";
          modes.setAttribute("role", "group");
          modes.setAttribute("aria-label", `Answer type for question ${question.number}`);
          const writeMode = document.createElement("button");
          writeMode.type = "button";
          writeMode.textContent = "Write";
          const drawMode = document.createElement("button");
          drawMode.type = "button";
          drawMode.textContent = "Draw";
          modes.append(writeMode, drawMode);

          const drawPanel = document.createElement("div");
          drawPanel.hidden = true;
          let pad = null;

          function refreshModes() {
            writeMode.classList.toggle("has-content", hasText(question));
            drawMode.classList.toggle("has-content", hasDrawing(question));
          }

          function setMode(mode) {
            const drawing = mode === "draw";
            writeMode.setAttribute("aria-pressed", String(!drawing));
            drawMode.setAttribute("aria-pressed", String(drawing));
            answer.hidden = drawing;
            drawPanel.hidden = !drawing;
            if (drawing && !pad) {
              if (!window.MathsDrawingPad) {
                drawPanel.textContent = "The drawing tools could not be loaded. Refresh the page to try again.";
                return;
              }
              pad = window.MathsDrawingPad.create({
                spec: question.drawing,
                value: saved.drawings[question.number],
                label: `Drawing area for question ${question.number}`,
                filename: `${safeTitle} - question ${question.number}`,
                onChange(value) {
                  if (value) saved.drawings[question.number] = value;
                  else delete saved.drawings[question.number];
                  checkResult.hidden = true;
                  refreshModes();
                  updateCheckButton();
                  if (answersVisible) {
                    updateAnswerFeedback(question, feedbackByQuestion.get(question.number));
                  }
                  saveProgress();
                },
              });
              drawPanel.append(pad.element);
              if (checkable) drawPanel.append(checkRow);
            }
          }

          // Automatic check for drawing questions that define `drawing.check`.
          const checkable = Boolean(window.MathsDrawingCheck?.hasCheck(question.drawing));
          const checkRow = document.createElement("div");
          checkRow.className = "drawing-check";
          const checkDrawingButton = document.createElement("button");
          checkDrawingButton.type = "button";
          checkDrawingButton.textContent = "Check my drawing";
          const checkResult = document.createElement("div");
          checkResult.className = "check-result";
          checkResult.setAttribute("aria-live", "polite");
          checkResult.hidden = true;
          checkRow.append(checkDrawingButton, checkResult);
          checkDrawingButton.addEventListener("click", () => {
            let result;
            try {
              result = window.MathsDrawingCheck.check(question.drawing, saved.drawings[question.number]);
            } catch (error) {
              console.error(`Drawing check for question ${question.number} failed.`, error);
              result = { status: "incorrect", messages: ["This drawing cannot be checked automatically. Ask your teacher."], tips: [], highlight: [] };
            }
            const list = document.createElement("ul");
            for (const message of result.messages) {
              const line = document.createElement("li");
              line.textContent = message;
              list.append(line);
            }
            for (const tip of result.tips) {
              const line = document.createElement("li");
              line.className = "tip";
              line.textContent = tip;
              list.append(line);
            }
            checkResult.className = `check-result ${result.status}`;
            checkResult.replaceChildren(list);
            checkResult.hidden = false;
            pad?.setHighlight(result.highlight);
          });

          writeMode.addEventListener("click", () => setMode("write"));
          drawMode.addEventListener("click", () => setMode("draw"));
          answerViews.set(question.number, {
            refreshModes,
            clearDrawing: () => {
              pad?.setValue(null);
              checkResult.hidden = true;
            },
          });
          refreshModes();
          setMode(
            hasDrawing(question) || (question.drawing && !hasText(question))
              ? "draw"
              : "write",
          );

          const feedback = document.createElement("section");
          feedback.setAttribute("aria-live", "polite");
          feedback.hidden = true;
          feedbackByQuestion.set(question.number, feedback);
          const completion = document.createElement("label");
          completion.className = "completion";
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = Boolean(saved.completed[question.number]);
          checkbox.addEventListener("change", () => {
            saved.completed[question.number] = checkbox.checked;
            updateProgress();
            saveProgress();
          });
          completion.append(checkbox, document.createTextNode("Mark this question complete"));
          card.append(number, prompt, ...questionFigure(question), modes, answer, drawPanel, feedback, completion);
          list.append(card);
        });

        resetButton.addEventListener("click", () => {
          if (!window.confirm("Clear all saved answers for this worksheet?")) return;
          saved = { answers: {}, completed: {}, drawings: {} };
          list.querySelectorAll("textarea").forEach((answer) => { answer.value = ""; });
          answerViews.forEach((view) => {
            view.clearDrawing();
            view.refreshModes();
          });
          list.querySelectorAll(".answer-feedback").forEach((feedback) => { feedback.hidden = true; });
          list.querySelectorAll('input[type="checkbox"]').forEach((checkbox) => { checkbox.checked = false; });
          answersVisible = false;
          checkButton.textContent = "Check answers";
          updateCheckButton();
          updateProgress();
          saveProgress();
        });

        updateProgress();
      }
    </script>
  </body>
</html>
